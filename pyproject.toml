[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lesson-pipeline-1c"
version = "0.1.0"
description = "Автоматизация производства видеоуроков по 1С"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.23.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "pysubs2>=1.7.0",
    "openai>=1.54.0",
    "python-multipart>=0.0.9",
    "edge-tts>=7.2.8,<8",
]

[project.optional-dependencies]
stt-local = ["faster-whisper>=1.0.0"]
tts-elevenlabs = ["elevenlabs>=1.0.0"]
audio = ["pydub>=0.25.1", "librosa>=0.10.2", "soundfile>=0.12.1", "scipy>=1.14.0"]
# Точные аннотации: OpenCV, PNG-оверлеи, MoviePy, ASS, template matching
annotations = [
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "moviepy>=2.1.0",
    "imageio[ffmpeg]>=2.34.0",
    "pysubs2>=1.7.0",
    "scikit-image>=0.24.0",
    "shapely>=2.0.0",
]
# OCR для привязки рамки к тексту на экране 1С (EasyOCR тяжёлый)
annotations-ocr = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[project.scripts]
lesson-pipeline = "src.orchestrator.run_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
